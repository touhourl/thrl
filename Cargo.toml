[package]
name = "rrr"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "rrr"
crate-type = ["cdylib", "rlib"]

[dependencies]

# [basic] Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

# [basic] CLI argument parsing
#clap = { version = "4", features = ["derive"] }

# [basic] Time handling
#chrono = { version = "0.4", features = ["serde"] }
#proc-maps = "0.4"

# [method] The way to with memory
nix = { version = "0.31.3", features = ["process", "signal"] }
libc = "0.2.189"

# [paper] Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# [paper]
csv = "1.4.0"

# [method]
#burn = { version = "0.20.1", default-features = false, features = ["std", "vulkan", "autodiff", "ndarray", "store"] }
#burn-ndarray = { version = "0.20.1", default-features = false, features = ["std", "multi-threads"] }

evdev = "0.13.2"
# [optimize]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal", "process", "sync"] }
thiserror = "2.0.20"
rand = "0.10.2"
pyo3 = { version = "0.29.2", features = ["extension-module"] }
#burn-wgpu = { version = "0.20.1", default-features = false, features = ["std", "vulkan"] }

[profile.release]
# [optimize]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
